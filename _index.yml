indexpage:
  title: ONTAP Select Dokumentation
  lead: NetApp ONTAP Select ist eine softwaredefinierte Speicherlösung, die Sie auf
    verschiedenen Standardservern mit dem VMware ESXi- oder Kernel-based Virtual Machine
    (KVM)-Hypervisor bereitstellen können. Sie bietet die Agilität, die Sie benötigen,
    um eine flexible und skalierbare Private-Cloud-Infrastruktur aufzubauen. Diese
    Website enthält die Dokumentation für ONTAP Select 9.18.1.
